syntax = "proto3";


enum Role {
    ROLE_ADMIN = 0;
    ROLE_MAINTAINER = 1;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message TokenResponse {
    string token_value = 1;
}

message UserInfo {
    string id = 1;
    string username = 2;
    Role role = 3;
    bool is_active = 4;
}

message ValidationRequest {
    string access_token = 1;
}

message ValidationTokenResponse {
    bool valid = 1;
    UserInfo user = 2;
}

message ListAccountsRequest {
    string access_token = 1;
}

message ListAccountsResponse {
    repeated UserInfo accounts = 1;
}

message CreateAccountRequest {
    string access_token = 1;
    string username = 2;
    Role role = 3;
}

message DeactivateAccountRequest {
    string access_token = 1;
    string username = 2;
}

message ActivateAccountRequest {
    string username = 1;
    string password = 2;
}

message DestroyTokenRequest {
    string access_token = 1;
}

message OperationResponse {
    bool success = 1;
    string message = 2;
}

service Login {
    rpc Login(LoginRequest) returns (TokenResponse);
    rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
    rpc CreateAccount(CreateAccountRequest) returns (OperationResponse);
    rpc DeactivateAccount(DeactivateAccountRequest) returns (OperationResponse);
    rpc ActivateAccount(ActivateAccountRequest) returns (OperationResponse);
    rpc ValidateToken(ValidationRequest) returns (ValidationTokenResponse);
    rpc DestroyToken(DestroyTokenRequest) returns (OperationResponse);
}